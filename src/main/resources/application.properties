# configuracao do bd
quarkus.datasource.db-kind = postgresql
quarkus.datasource.username = postgres
quarkus.datasource.password = 123654
quarkus.datasource.jdbc.url = jdbc:postgresql://localhost:5432/topicos2db

quarkus.hibernate-orm.database.generation=drop-and-create

# desabilitar o docker 
quarkus.devservices.enabled=false

quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=true

# configuracao do cors
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,PUT,POST,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
# wildcard (*) é incompatível com allow-credentials=true — listar explicitamente
quarkus.http.cors.exposed-headers=Authorization, Content-Disposition, X-Page, X-Page-Size, X-Total-Count
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# base url para o type em exception
%dev.problem.base-url=http://localhost:8080
# %prod.problem.base-url=https://api.seusistema.com

# configuracao do jwt
# mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
# mp.jwt.verify.issuer=unitins-jwt
# smallrye.jwt.sign.key.location=META-INF/resources/privateKey.pem

# configuracao do keycloak (OIDC)
# A integracao esta preparada, mas DESLIGADA: o app sobe normalmente sem Keycloak rodando
# e todos os endpoints continuam abertos.
# Para ligar:
#   1. troque quarkus.oidc.enabled para true (propriedade de build: reinicie o quarkus:dev)
#   2. descomente e preencha as propriedades abaixo com os dados do realm/client
#   3. desligue o smallrye-jwt (dois mecanismos de bearer token entram em conflito)
#   4. troque os comentarios "// TODO: @RolesAllowed" dos resources pelas anotacoes
quarkus.oidc.enabled=false
# URL do realm no Keycloak (http://<host>:<porta>/realms/<realm>)
# quarkus.oidc.auth-server-url=http://localhost:8180/realms/fincontrol
# client criado no realm para o back-end
# quarkus.oidc.client-id=fincontrol-backend
# secret do client (aba Credentials do client no Keycloak)
# quarkus.oidc.credentials.secret=troque-pelo-secret-do-client
# o back so valida bearer tokens enviados pelo front; quem faz o login e o Angular
# quarkus.oidc.application-type=service
# o Keycloak coloca as roles do realm (USER, ADMIN) em realm_access.roles
# quarkus.oidc.roles.role-claim-path=realm_access/roles
# quarkus.smallrye-jwt.enabled=false
# policy enforcer do Keycloak Authorization Services: o controle sera por @RolesAllowed
# quarkus.keycloak.policy-enforcer.enable=false


# dev service do seaweedfs (sobe container automaticamente no perfil dev)
# para desabilitar: %dev.seaweedfs.devservice.enabled=false
# %dev.seaweedfs.devservice.enabled=true

# log detalhado no perfil dev
# %dev.quarkus.log.console.enable=true
# %dev.quarkus.log.console.level=DEBUG
# %dev.quarkus.log.category."br.unitins.tp2".level=DEBUG
# %dev.quarkus.log.category."io.vertx.ext.web".level=DEBUG
# %dev.quarkus.log.category."io.quarkus.vertx.http".level=DEBUG

# cliente REST do ViaCEP (consulta de endereço por CEP)
quarkus.rest-client.viacep.url=https://viacep.com.br
quarkus.rest-client.viacep.connect-timeout=3000
quarkus.rest-client.viacep.read-timeout=5000
