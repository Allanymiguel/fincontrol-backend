# configuracao do bd
quarkus.datasource.db-kind = postgresql
quarkus.datasource.username = postgres
quarkus.datasource.password = 123654
quarkus.datasource.jdbc.url = jdbc:postgresql://localhost:5432/topicos2db

quarkus.hibernate-orm.database.generation=drop-and-create

# desabilitar o docker 
quarkus.devservices.enabled=false

quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=true

# configuracao do cors
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,PUT,POST,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
# wildcard (*) é incompatível com allow-credentials=true — listar explicitamente
quarkus.http.cors.exposed-headers=Authorization, Content-Disposition, X-Page, X-Page-Size, X-Total-Count
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# base url para o type em exception
%dev.problem.base-url=http://localhost:8080
# %prod.problem.base-url=https://api.seusistema.com

# configuracao do keycloak
# O Keycloak faz login e emite o JWT; o back nunca gera nem assina token.
# Dev: suba o Keycloak com "docker compose up -d" (ver KEYCLOAK.md), que ja importa o realm
# keycloak/fincontrol-realm.json com roles, client e usuarios de teste.
fincontrol.keycloak.url=${KEYCLOAK_URL:http://localhost:8180}
fincontrol.keycloak.realm=fincontrol
fincontrol.keycloak.client-id=fincontrol-backend
# o valor padrao e o secret do realm de DESENVOLVIMENTO; em producao use a variavel de ambiente
fincontrol.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:fincontrol-dev-secret}

# 1) servidor de recursos: valida o "Authorization: Bearer" com as chaves publicas do realm
quarkus.oidc.auth-server-url=${fincontrol.keycloak.url}/realms/${fincontrol.keycloak.realm}
quarkus.oidc.client-id=${fincontrol.keycloak.client-id}
quarkus.oidc.application-type=service
# as roles do realm (USER, ADMIN) vem em realm_access.roles e viram roles do @RolesAllowed
quarkus.oidc.roles.role-claim-path=realm_access/roles

# autentica so quando o endpoint exige (@RolesAllowed/@Authenticated); assim token invalido
# vira 401 com Problem pelo AuthenticationFailedExceptionMapper, como os outros erros da API
quarkus.http.auth.proactive=false
# Chave do modo dev (quarkus:dev): FINCONTROL_AUTH=false libera os endpoints para usar o app
# sem o Keycloak rodando. Fora do modo dev a autenticacao e sempre exigida.
%dev.quarkus.security.auth.enabled-in-dev-mode=${FINCONTROL_AUTH:true}

# 2) login: o back repassa e-mail/senha para o endpoint de token do realm
quarkus.rest-client.keycloak-token.url=${fincontrol.keycloak.url}/realms/${fincontrol.keycloak.realm}/protocol/openid-connect
# 3) Admin REST API: criar usuario, atribuir role, ativar/desativar
quarkus.rest-client.keycloak-admin.url=${fincontrol.keycloak.url}/admin/realms/${fincontrol.keycloak.realm}
quarkus.rest-client.keycloak-token.connect-timeout=3000
quarkus.rest-client.keycloak-token.read-timeout=5000
quarkus.rest-client.keycloak-admin.connect-timeout=3000
quarkus.rest-client.keycloak-admin.read-timeout=5000


# dev service do seaweedfs (sobe container automaticamente no perfil dev)
# para desabilitar: %dev.seaweedfs.devservice.enabled=false
# %dev.seaweedfs.devservice.enabled=true

# log detalhado no perfil dev
