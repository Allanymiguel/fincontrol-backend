# configuracao do bd
quarkus.datasource.db-kind = postgresql
quarkus.datasource.username = ${DB_USERNAME}
quarkus.datasource.password = ${DB_PASSWORD}
quarkus.datasource.jdbc.url = ${DB_URL}

# drop-and-create apaga o banco a cada subida: em producao use none ou validate
quarkus.hibernate-orm.database.generation=${DB_GENERATION:drop-and-create}
# referencia.sql (estados, municipios do IBGE e faixas de CEP) antes dos dados de exemplo
quarkus.hibernate-orm.sql-load-script=${DB_LOAD_SCRIPT:referencia.sql,import.sql}

# desabilitar o docker 
quarkus.devservices.enabled=false

# bind-parameters mostra os valores (dados pessoais) no log: desligue em producao
quarkus.hibernate-orm.log.sql=${LOG_SQL:true}
quarkus.hibernate-orm.log.bind-parameters=${LOG_SQL:true}

# configuracao do cors
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS}
quarkus.http.cors.methods=GET,PUT,POST,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
# wildcard (*) é incompatível com allow-credentials=true — listar explicitamente
quarkus.http.cors.exposed-headers=Authorization, Content-Disposition, X-Page, X-Page-Size, X-Total-Count
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# base url para o type em exception
# obrigatoria em todos os perfis (os ExceptionMappers injetam sem valor padrao)
problem.base-url=${PROBLEM_BASE_URL}

# configuracao do keycloak
# O Keycloak faz login e emite o JWT; o back nunca gera nem assina token.
# Dev: suba o Keycloak com "docker compose up -d" (ver KEYCLOAK.md), que ja importa o realm
# keycloak/fincontrol-realm.json com roles, client e usuarios de teste.
fincontrol.keycloak.url=${KEYCLOAK_URL}
fincontrol.keycloak.realm=${KEYCLOAK_REALM:fincontrol}
fincontrol.keycloak.client-id=${KEYCLOAK_CLIENT_ID:fincontrol-backend}
# sem valor padrao: vem do .env (dev) ou da variavel de ambiente (producao)
fincontrol.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}

# 1) servidor de recursos: valida o "Authorization: Bearer" com as chaves publicas do realm
quarkus.oidc.auth-server-url=${KEYCLOAK_URL}/realms/${fincontrol.keycloak.realm}
quarkus.oidc.client-id=${fincontrol.keycloak.client-id}
quarkus.oidc.application-type=service
# as roles do realm (USER, ADMIN) vem em realm_access.roles e viram roles do @RolesAllowed
quarkus.oidc.roles.role-claim-path=realm_access/roles

# autentica so quando o endpoint exige (@RolesAllowed/@Authenticated); assim token invalido
# vira 401 com Problem pelo AuthenticationFailedExceptionMapper, como os outros erros da API
quarkus.http.auth.proactive=false
# Swagger: o "Authorize" faz o login na tela do Keycloak (Authorization Code com PKCE, client do front)
quarkus.smallrye-openapi.security-scheme=oidc
quarkus.smallrye-openapi.oidc-open-id-connect-url=${KEYCLOAK_URL}/realms/${fincontrol.keycloak.realm}/.well-known/openid-configuration
quarkus.swagger-ui.oauth-client-id=${KEYCLOAK_FRONTEND_CLIENT_ID:fincontrol-frontend}
quarkus.swagger-ui.oauth-use-pkce-with-authorization-code-grant=true
quarkus.swagger-ui.oauth-scopes=openid
# Chave do modo dev (quarkus:dev): FINCONTROL_AUTH=false libera os endpoints para usar o app
# sem o Keycloak rodando. Fora do modo dev a autenticacao e sempre exigida.
%dev.quarkus.security.auth.enabled-in-dev-mode=${FINCONTROL_AUTH}

# 2) endpoint de token do realm: so para o token da service account (o login e feito direto no Keycloak)
quarkus.rest-client.keycloak-token.url=${KEYCLOAK_URL}/realms/${fincontrol.keycloak.realm}/protocol/openid-connect
# 3) Admin REST API: criar usuario, atribuir role, ativar/desativar
quarkus.rest-client.keycloak-admin.url=${KEYCLOAK_URL}/admin/realms/${fincontrol.keycloak.realm}
quarkus.rest-client.keycloak-token.connect-timeout=3000
quarkus.rest-client.keycloak-token.read-timeout=5000
quarkus.rest-client.keycloak-admin.connect-timeout=3000
quarkus.rest-client.keycloak-admin.read-timeout=5000

# imagens dos planos: Object Storage S3 (SeaweedFS do docker-compose.yml)
# Endpoint e chaves sem valor padrao: sem .env, o app falha na subida.
quarkus.s3.endpoint-override=${S3_ENDPOINT}
quarkus.s3.aws.region=${S3_REGION}
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=${S3_ACCESS_KEY}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${S3_SECRET_KEY}
# obrigatorio: sem path-style o SDK chama fincontrol.localhost:8333, que o SeaweedFS local nao atende
quarkus.s3.path-style-access=true
quarkus.s3.sync-client.type=url
# timeouts curtos: S3 fora do ar vira 503 rapido em vez de travar a requisicao
quarkus.s3.sync-client.connection-timeout=2S
quarkus.s3.sync-client.socket-timeout=5S
quarkus.s3.devservices.enabled=false
fincontrol.storage.bucket=${S3_BUCKET}
fincontrol.storage.verificar-bucket-na-subida=true

# upload: o limite da imagem e 2 MB (RegrasImagem); 3M deixa o validador responder com Problem e
# so corpos bem maiores recebem o 413 do Vert.x
quarkus.http.limits.max-body-size=3M
quarkus.http.body.delete-uploaded-files-on-end=true

# testes: valores ficticios, porque o ArmazenamentoService e simulado nos testes
%test.quarkus.s3.endpoint-override=http://localhost:1
%test.quarkus.s3.aws.region=us-east-1
%test.quarkus.s3.aws.credentials.static-provider.access-key-id=test
%test.quarkus.s3.aws.credentials.static-provider.secret-access-key=test
%test.fincontrol.storage.bucket=fincontrol-test
%test.fincontrol.storage.verificar-bucket-na-subida=false

# log detalhado no perfil dev
# %dev.quarkus.log.console.enable=true
