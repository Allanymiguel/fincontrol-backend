# cliente REST do ViaCEP (consulta de endereço por CEP)
quarkus.rest-client.viacep.url=${VIACEP_URL:https://viacep.com.br}
quarkus.rest-client.viacep.connect-timeout=3000
quarkus.rest-client.viacep.read-timeout=5000

# endereco de CLIENTES: base local primeiro; o ViaCEP e so uma fonte opcional, com timeout curto.
# habilitada = valor inicial; o admin liga e desliga na tela de CEPs sem reiniciar o back.
fincontrol.cep.api-externa.habilitada=${CEP_API_EXTERNA:true}
quarkus.rest-client.viacep-endereco.url=${VIACEP_URL:https://viacep.com.br}
quarkus.rest-client.viacep-endereco.connect-timeout=2000
quarkus.rest-client.viacep-endereco.read-timeout=3000

# cobranca diaria das assinaturas (RN16): aplica trocas agendadas e registra os pagamentos vencidos
fincontrol.cobranca.cron=${COBRANCA_CRON:0 0 3 * * ?}

# usuario usado quando FINCONTROL_AUTH=false (modo dev sem Keycloak)
fincontrol.auth.dev-fallback-email=${AUTH_DEV_FALLBACK_EMAIL:joao@email.com}
