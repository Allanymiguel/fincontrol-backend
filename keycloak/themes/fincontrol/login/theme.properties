# Tema de login do FinControl: mesmo visual da antiga tela de login do Angular (marca a esquerda,
# formulario a direita). Herda os templates e as mensagens do tema "keycloak"; so o layout
# (template.ftl) e a tela de login (login.ftl) sao proprios. As outras telas (esqueci minha senha,
# nova senha, aviso, erro) usam os templates herdados com as classes abaixo.
parent=keycloak
import=common/keycloak

# sem PatternFly: so o CSS do FinControl
stylesCommon=
styles=css/fincontrol.css
meta=viewport==width=device-width,initial-scale=1
locales=pt-BR

kcHtmlClass=
kcBodyClass=
kcLoginClass=
kcContentWrapperClass=
kcLabelWrapperClass=
kcInputWrapperClass=
kcFormOptionsClass=fc-opcoes
kcFormOptionsWrapperClass=
kcFormButtonsClass=fc-botoes
kcFormSettingClass=fc-opcoes
kcFormClass=fc-form
kcFormGroupClass=fc-campo
kcFormGroupErrorClass=fc-campo-erro
kcLabelClass=fc-label
kcInputClass=fc-input
kcInputGroup=fc-input-grupo
kcInputErrorMessageClass=fc-erro-campo
kcButtonClass=fc-botao
kcButtonPrimaryClass=fc-botao-primario
kcButtonDefaultClass=fc-botao-secundario
kcButtonBlockClass=fc-botao-bloco
kcButtonLargeClass=
kcSignUpClass=rodape
kcInfoAreaWrapperClass=
kcFormPasswordVisibilityButtonClass=fc-botao-olho
kcFormPasswordVisibilityIconShow=fc-icone fc-icone-olho
kcFormPasswordVisibilityIconHide=fc-icone fc-icone-olho-fechado
kcResetFlowIcon=fc-icone fc-icone-reiniciar
