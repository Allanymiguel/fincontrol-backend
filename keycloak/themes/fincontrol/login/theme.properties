# Tema do FinControl para as telas do Keycloak abertas pelo link de e-mail (nova senha, aviso e erro),
# com o mesmo visual das telas de acesso do Angular. O login acontece no app. Herda os templates e as
# mensagens do tema "keycloak"; so o layout (template.ftl) e proprio.
parent=keycloak
import=common/keycloak

# sem PatternFly: so o CSS do FinControl
