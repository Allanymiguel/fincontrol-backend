# Keycloak de DESENVOLVIMENTO para o FinControl: docker compose up -d
# Console de administracao: http://localhost:8180 (admin / admin)
# Na primeira subida importa keycloak/fincontrol-realm.json (realm, roles, clients e usuarios de teste).
# O Mailpit recebe os e-mails do Keycloak ("Esqueci minha senha"): http://localhost:8025
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: fincontrol-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      # tema de login com o visual do FinControl (start-dev nao guarda cache: editar e recarregar)
      - ./keycloak/themes/fincontrol:/opt/keycloak/themes/fincontrol:ro

  # servidor de e-mail falso: recebe o "Esqueci minha senha" do Keycloak (caixa em http://localhost:8025)
  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: fincontrol-mailpit
    ports:
      - "8025:8025"
