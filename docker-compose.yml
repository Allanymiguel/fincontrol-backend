# Keycloak de DESENVOLVIMENTO para o FinControl: docker compose up -d
# Console de administracao: http://localhost:8180 (admin / admin)
# Na primeira subida importa keycloak/fincontrol-realm.json (realm, roles, client e usuarios de teste).
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: fincontrol-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
